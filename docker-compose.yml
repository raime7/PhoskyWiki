services:
  postgres:
    image: postgres:18-alpine
    container_name: phoskywiki-postgres
    environment:
      POSTGRES_USER: phosky
      POSTGRES_PASSWORD: phosky
      POSTGRES_DB: phoskywiki
    ports:
      - "5432:5432"
    volumes:
      # PG 18+ 要求挂载父目录，数据落在其子目录，便于将来 pg_upgrade
      # 见 https://github.com/docker-library/postgres/issues/37
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U phosky -d phoskywiki"]
      interval: 5s
      timeout: 3s
      retries: 12

  meilisearch:
    image: getmeili/meilisearch:v1.15.0
    container_name: phoskywiki-meilisearch
    environment:
      MEILI_ENV: development
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:-dev-meili-master-key}
    ports:
      - "7700:7700"
    volumes:
      - meili_data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:7700/health | grep -q available"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  pgdata:
  meili_data:
